action_normalization:
  enabled: true
algorithm:
  device: auto
  kwargs:
    batch_size: 512
    gamma: 0.95
    learning_rate:
      final: 0.0
      initial: 0.0001
      schedule: linear
    n_epochs: 10
    n_steps: 512
    target_kl: 0.04
  name: PPO
  policy: MlpPolicy
  policy_kwargs:
    activation_fn: tanh
    net_arch:
    - 512
    - 512
    - 512
    - 512
    - 512
checkpointing:
  enabled: true
  save_freq: 250000
environment:
  id: horcrux_env/plane-direct-torque-scalable-v0
