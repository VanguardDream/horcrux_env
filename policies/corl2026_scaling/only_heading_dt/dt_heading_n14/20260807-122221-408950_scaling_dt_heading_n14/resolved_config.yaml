schema_version: 2
experiment:
  name: scaling_dt_heading_n14
  seed: 44
  output_dir: runs/corl2026_scaling/dt_heading_n14
environment:
  id: horcrux_env/plane-direct-torque-scalable-v0
  kwargs:
    n_joints: 14
    joy_input_random: false
    joy_input:
    - 1.0
    - 0.0
    - 0.0
    torque_min: -2.7
    torque_max: 2.7
    rotation_norm_cost_weight: 10.0
    use_friction_chg: false
    terminate_when_unhealthy: true
    unhealthy_max_steps: 10
    use_imu_window: false
    use_vels_window: false
sampling:
  num_envs: 8
  vec_env: subproc
  start_method: spawn
normalization:
  enabled: true
  clip_obs: 10.0
  epsilon: 1.0e-08
action_normalization:
  enabled: true
algorithm:
  name: PPO
  policy: MlpPolicy
  device: auto
  kwargs:
    learning_rate: 0.0003
    gamma: 0.95
    n_steps: 512
    batch_size: 512
    n_epochs: 5
  policy_kwargs:
    net_arch:
    - 512
    - 512
    - 512
    - 512
    - 512
    activation_fn: tanh
training:
  total_timesteps: 7864320
evaluation:
  enabled: true
  eval_freq: 100000
  n_eval_episodes: 3
  deterministic: true
checkpointing:
  enabled: true
  save_freq: 250000
video:
  enabled: true
  start_iteration: 10
  record_every_iterations: 200
  video_length: 300
  deterministic: true
