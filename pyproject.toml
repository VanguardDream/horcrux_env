[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["horcrux_env"]

[project]
name = "horcrux_env"
version = "0.0.1"
dependencies = [
  "gymnasium[mujoco]",
  "mujoco>=3.4.0",
  "scipy",
  "pygame>=2.1.3",
  "pre-commit",
]

[project.optional-dependencies]
train = [
  "ray[rllib]",
  "torch",
  "PyYAML",
  "tensorboard",
]
