schema_version: 2

# Backward-left 45-degree diagonal policy, from scratch.
#
# gait [30,30,40,40,203,-1] is the TIME-REVERSED forward-right diagonal gait.
# Three independent derivations converge on it: (a) time reversal negates the
# displacement vector, so reversing the validated FR-diag (+x,-y) gait gives
# (-x,+y); (b) it is the y-mirror (delta+180) of the backward-right candidate
# (23,-1); (c) the validated backward lineage used exactly this recipe —
# reverse of the opposite-direction forward gait ((0,-1), best 209,908).
# Open-loop displacement of reversed gaits is small/noisy (friction
# irreversibility) and even the validated (0,-1) drifts forward open-loop,
# so RL is expected to carve the motion out of this neutral prior as before.
# joy_input is the unit vector at +135 degrees: [-sqrt(2)/2, sqrt(2)/2, 0].
#
# Reward weights identical to all other lineages; validated Stage 1 recipe.
experiment:
  name: ppo_plane_diag_bl_from_scratch_long
  seed: 42
  output_dir: runs/ppo_plane_diag_bl_from_scratch_long

environment:
  id: horcrux_env/plane-v0
  kwargs:
    joy_input_random: false
    joy_input: [-0.7071, 0.7071, 0.0]
    use_gait: true
    gait_params: [30, 30, 40, 40, 203, -1]

    forward_reward_weight: 60.0
    efficiency_reward_weight: 3.0
    healthy_reward: 2.0
    rotation_norm_cost_weight: 10.0
    proj_dist_cost_weight: 0.0
    ctrl_cost_weight: 0.0

    use_friction_chg: false
    terminate_when_unhealthy: true
    unhealthy_max_steps: 30
    use_imu_window: false
    use_vels_window: false

sampling:
  num_envs: 8
  vec_env: subproc
  start_method: spawn

normalization:
  enabled: true
  clip_obs: 10.0
  epsilon: 1.0e-8

action_normalization:
  enabled: true

# Intentionally no resume section: initialize a new policy and optimizer.
algorithm:
  name: PPO
  policy: MlpPolicy
  device: auto
  kwargs:
    learning_rate: 0.0001
    gamma: 0.95
    n_steps: 512
    batch_size: 512
    n_epochs: 2
    target_kl: 0.04
  policy_kwargs:
    net_arch: [512, 512, 512, 512, 512]
    activation_fn: tanh

# 6,937 iterations * (512 steps * 8 environments) = 28,413,952.
training:
  total_timesteps: 28413952

evaluation:
  enabled: true
  eval_freq: 100000
  n_eval_episodes: 3
  deterministic: true

checkpointing:
  enabled: true
  save_freq: 250000

video:
  enabled: true
  start_iteration: 10
  record_every_iterations: 100
  video_length: 300
  deterministic: true
