schema_version: 2

# Stage 2: continue the backward-right diagonal (23,-1) policy.
#
# Basis (diag_br Stage 1, run 20260904-102334-622556): final approx_kl 0.0210
# (~1/2 of target_kl), clip_fraction 0.209, only 6 KL early-stops — headroom
# remains and the return was still rising (150,747 best). Apply the
# lineage-validated Stage 2 recipe: n_epochs 2 -> 3, lr/target_kl kept.
experiment:
  name: ppo_plane_diag_br_continue_stage2
  seed: 42
  output_dir: runs/ppo_plane_diag_br_continue_stage2

environment:
  id: horcrux_env/plane-v0
  kwargs:
    joy_input_random: false
    joy_input: [-0.7071, -0.7071, 0.0]
    use_gait: true
    gait_params: [30, 30, 40, 40, 23, -1]

    forward_reward_weight: 60.0
    efficiency_reward_weight: 3.0
    healthy_reward: 2.0
    rotation_norm_cost_weight: 10.0
    proj_dist_cost_weight: 0.0
    ctrl_cost_weight: 0.0

    use_friction_chg: false
    terminate_when_unhealthy: true
    unhealthy_max_steps: 30
    use_imu_window: false
    use_vels_window: false

sampling:
  num_envs: 8
  vec_env: subproc
  start_method: spawn

normalization:
  enabled: true
  clip_obs: 10.0
  epsilon: 1.0e-8

action_normalization:
  enabled: true

resume:
  model_path: policies/path_tracking/diag_backward_right/01_diag_br_from_scratch_long/final_model.zip
  vecnormalize_path: policies/path_tracking/diag_backward_right/01_diag_br_from_scratch_long/vecnormalize.pkl

algorithm:
  name: PPO
  policy: MlpPolicy
  device: auto
  kwargs:
    learning_rate: 0.0001
    gamma: 0.95
    n_steps: 512
    batch_size: 512
    n_epochs: 3
    target_kl: 0.04
  policy_kwargs:
    net_arch: [512, 512, 512, 512, 512]
    activation_fn: tanh

# Additional samples; reset_num_timesteps=False keeps TensorBoard/checkpoint
# steps cumulative (Stage 2 spans 28.4M -> 56.8M).
training:
  total_timesteps: 28413952

evaluation:
  enabled: true
  eval_freq: 250000
  n_eval_episodes: 3
  deterministic: true

checkpointing:
  enabled: true
  save_freq: 500000

video:
  enabled: true
  start_iteration: 10
  record_every_iterations: 200
  video_length: 300
  deterministic: true
