schema_version: 2

# Forward-right 45-degree diagonal policy, from scratch.
#
# gait delta=203 (= 23 + 180) is the exact x-z plane mirror of the validated
# forward-left diagonal gait (delta=23): verified numerically — dorsal rows
# 100% identical, lateral rows 100% negated. The delta=-23 entry in the
# plane_v3.py direction comment table is NOT the mirror (lateral agreement
# 25.6%), the same error type as delta=-45 was for rightward.
# joy_input is the unit vector at -45 degrees: [sqrt(2)/2, -sqrt(2)/2, 0].
#
# Reward weights identical to all other lineages; validated Stage 1 recipe.
experiment:
  name: ppo_plane_diag_fr_from_scratch_long
  seed: 42
  output_dir: runs/ppo_plane_diag_fr_from_scratch_long

environment:
  id: horcrux_env/plane-v0
  kwargs:
    joy_input_random: false
    joy_input: [0.7071, -0.7071, 0.0]
    use_gait: true
    gait_params: [30, 30, 40, 40, 203]

    forward_reward_weight: 60.0
    efficiency_reward_weight: 3.0
    healthy_reward: 2.0
    rotation_norm_cost_weight: 10.0
    proj_dist_cost_weight: 0.0
    ctrl_cost_weight: 0.0

    use_friction_chg: false
    terminate_when_unhealthy: true
    unhealthy_max_steps: 30
    use_imu_window: false
    use_vels_window: false

sampling:
  num_envs: 8
  vec_env: subproc
  start_method: spawn

normalization:
  enabled: true
  clip_obs: 10.0
  epsilon: 1.0e-8

action_normalization:
  enabled: true

# Intentionally no resume section: initialize a new policy and optimizer.
algorithm:
  name: PPO
  policy: MlpPolicy
  device: auto
  kwargs:
    learning_rate: 0.0001
    gamma: 0.95
    n_steps: 512
    batch_size: 512
    n_epochs: 2
    target_kl: 0.04
  policy_kwargs:
    net_arch: [512, 512, 512, 512, 512]
    activation_fn: tanh

# 6,937 iterations * (512 steps * 8 environments) = 28,413,952.
training:
  total_timesteps: 28413952

evaluation:
  enabled: true
  eval_freq: 100000
  n_eval_episodes: 3
  deterministic: true

checkpointing:
  enabled: true
  save_freq: 250000

video:
  enabled: true
  start_iteration: 10
  record_every_iterations: 100
  video_length: 300
  deterministic: true
