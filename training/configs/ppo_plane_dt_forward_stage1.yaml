schema_version: 2

# GD control group (direct torque), forward (+X), stage 1 of 5.
#
# Mirrors the gait-decomposition forward lineage stage
# policies/path_tracking/forward/01_initial_sb3_baseline
# (config: ppo_plane.yaml) exactly, except the environment: the policy outputs
# signed joint torques directly and observations omit the 14-dim gait motion
# vector. Every PPO hyperparameter, seed, network, normalization, and timestep
# budget matches the treatment group for a fair ablation comparison.

experiment:
  name: ppo_plane_dt_forward_stage1
  seed: 42
  output_dir: runs/ppo_plane_dt_forward_stage1

environment:
  id: horcrux_env/plane-direct-torque-v0
  kwargs:
    joy_input_random: false
    joy_input: [1.0, 0.0, 0.0]
    torque_min: -2.7
    torque_max: 2.7
    use_friction_chg: false
    terminate_when_unhealthy: true
    unhealthy_max_steps: 30
    use_imu_window: false
    use_vels_window: false

sampling:
  num_envs: 8
  vec_env: subproc
  start_method: spawn

normalization:
  enabled: true
  clip_obs: 10.0
  epsilon: 1.0e-8

action_normalization:
  enabled: true

algorithm:
  name: PPO
  policy: MlpPolicy
  device: auto
  kwargs:
    learning_rate: 0.0003
    gamma: 0.95
    n_steps: 512
    batch_size: 512
    n_epochs: 5
  policy_kwargs:
    net_arch: [512, 512, 512, 512, 512]
    activation_fn: tanh

training:
  total_timesteps: 7864320

evaluation:
  enabled: true
  eval_freq: 10000
  n_eval_episodes: 5
  deterministic: true

checkpointing:
  enabled: true
  save_freq: 10000

video:
  enabled: true
  start_iteration: 10
  record_every_iterations: 100
  video_length: 300
  deterministic: true
