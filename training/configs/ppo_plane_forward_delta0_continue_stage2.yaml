schema_version: 2

# Stage 2: continue the forward delta=0 policy in a new run.
#
# Basis (forward delta0 Stage 1, run 20260831-215034-678652): final approx_kl
# 0.0123 (~1/3 of target_kl), clip_fraction 0.101, 14 KL early-stops — the
# trust region ended with headroom. Following the validated left/right Stage 2
# recipe, raise update intensity with n_epochs 2 -> 3 while keeping
# learning_rate and target_kl.
# Everything else (environment, gait delta=0, rewards, network) is frozen.
experiment:
  name: ppo_plane_forward_delta0_continue_stage2
  seed: 42
  output_dir: runs/ppo_plane_forward_delta0_continue_stage2

environment:
  id: horcrux_env/plane-v0
  kwargs:
    joy_input_random: false
    joy_input: [1.0, 0.0, 0.0]
    use_gait: true
    gait_params: [30, 30, 40, 40, 0]

    forward_reward_weight: 60.0
    efficiency_reward_weight: 3.0
    healthy_reward: 2.0
    rotation_norm_cost_weight: 10.0
    proj_dist_cost_weight: 0.0
    ctrl_cost_weight: 0.0

    use_friction_chg: false
    terminate_when_unhealthy: true
    unhealthy_max_steps: 30
    use_imu_window: false
    use_vels_window: false

sampling:
  num_envs: 8
  vec_env: subproc
  start_method: spawn

normalization:
  enabled: true
  clip_obs: 10.0
  epsilon: 1.0e-8

action_normalization:
  enabled: true

resume:
  model_path: policies/path_tracking/forward/01_forward_delta0_from_scratch_long/final_model.zip
  vecnormalize_path: policies/path_tracking/forward/01_forward_delta0_from_scratch_long/vecnormalize.pkl

algorithm:
  name: PPO
  policy: MlpPolicy
  device: auto
  kwargs:
    learning_rate: 0.0001
    gamma: 0.95
    n_steps: 512
    batch_size: 512
    n_epochs: 3
    target_kl: 0.04
  policy_kwargs:
    net_arch: [512, 512, 512, 512, 512]
    activation_fn: tanh

# Additional samples; reset_num_timesteps=False keeps TensorBoard/checkpoint
# steps cumulative (Stage 2 spans 28.4M -> 56.8M).
training:
  total_timesteps: 28413952

evaluation:
  enabled: true
  eval_freq: 250000
  n_eval_episodes: 3
  deterministic: true

checkpointing:
  enabled: true
  save_freq: 500000

video:
  enabled: true
  start_iteration: 10
  record_every_iterations: 200
  video_length: 300
  deterministic: true
