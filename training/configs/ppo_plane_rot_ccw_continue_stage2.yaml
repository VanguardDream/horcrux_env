schema_version: 2

# Stage 2: refine the good long-episode basin of the CCW rotation policy.
#
# Stage 1 (capped-anchor restart) found an excellent regime early — best eval
# 246,967 @ 6.3M with ep_len 4,403 — then drifted into a fast-but-falling
# regime (1.44 rad/s, ep_len ~100-900) under lr 1e-4: with gamma 0.95 the
# ~20-step effective horizon cannot see termination ~900 steps ahead, so the
# spin-faster gradient dominates. Therefore resume from evaluation/BEST (not
# final, documented deviation from lineage convention) with conservative
# lr 5e-5 / n_epochs 2 to polish the good basin; eval-best remains the net.
experiment:
  name: ppo_plane_rot_ccw_continue_stage2
  seed: 42
  output_dir: runs/ppo_plane_rot_ccw_continue_stage2

environment:
  id: horcrux_env/plane-rotation-v0
  kwargs:
    joy_input_random: false
    joy_input: [0.0, 0.0, 1.0]
    use_gait: true
    gait_params: [30, 30, 40, 40, 315]

    rotation_reward_weight: 45.0
    anchor_cost_weight: 50.0
    anchor_dead_zone: 0.15
    anchor_cost_cap: 2.0
    trans_vel_cost_weight: 0.0
    efficiency_reward_weight: 3.0
    healthy_reward: 2.0
    ctrl_cost_weight: 0.0

    use_friction_chg: false
    terminate_when_unhealthy: true
    unhealthy_max_steps: 30
    use_imu_window: false
    use_vels_window: false

sampling:
  num_envs: 8
  vec_env: subproc
  start_method: spawn

normalization:
  enabled: true
  clip_obs: 10.0
  epsilon: 1.0e-8

action_normalization:
  enabled: true

resume:
  model_path: policies/rotation/ccw/00_v1_experiments/v1b_stage1_overspeed_collapse/evaluation/best_model.zip
  vecnormalize_path: policies/rotation/ccw/00_v1_experiments/v1b_stage1_overspeed_collapse/evaluation/best_model_vecnormalize.pkl

algorithm:
  name: PPO
  policy: MlpPolicy
  device: auto
  kwargs:
    learning_rate: 0.00005
    gamma: 0.95
    n_steps: 512
    batch_size: 512
    n_epochs: 2
    target_kl: 0.04
  policy_kwargs:
    net_arch: [512, 512, 512, 512, 512]
    activation_fn: tanh

# 6,937 iterations * (512 steps * 8 environments) = 28,413,952.
training:
  total_timesteps: 28413952

evaluation:
  enabled: true
  eval_freq: 100000
  n_eval_episodes: 3
  deterministic: true

checkpointing:
  enabled: true
  save_freq: 250000

video:
  enabled: true
  start_iteration: 10
  record_every_iterations: 100
  video_length: 300
  deterministic: true
