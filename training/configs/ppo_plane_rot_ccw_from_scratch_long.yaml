schema_version: 2

# In-place CCW rotation policy, from scratch, on plane-rotation-v0.
#
# gait [30,30,40,40,315]: the only delta pair (with its mirror 135=CW) whose
# open-loop rotation mode is compatible with the health model — lateral-taper
# amplitudes give +1,901 deg / 3,000 steps with ~1% roll violation and ~1.2 m
# drift (verified 2026-09-05). Command joy_input=[0,0,+1] (CCW).
# Reward: rotation alignment 45 + efficiency 3 + healthy 2 - anchor 50*dist.
# anchor_cost_weight=50 is the one unvalidated knob — check env/anchor_distance
# and env/reward_angular_movement around 2-3M steps for anchor-induced stall.
# PPO follows the Stage 1 recipe validated across all eight direction lineages.
experiment:
  name: ppo_plane_rot_ccw_from_scratch_long
  seed: 42
  output_dir: runs/ppo_plane_rot_ccw_from_scratch_long

environment:
  id: horcrux_env/plane-rotation-v0
  kwargs:
    joy_input_random: false
    joy_input: [0.0, 0.0, 1.0]
    use_gait: true
    gait_params: [30, 30, 40, 40, 315]

    rotation_reward_weight: 45.0
    anchor_cost_weight: 50.0
    anchor_dead_zone: 0.15
    anchor_cost_cap: 2.0
    trans_vel_cost_weight: 0.0
    efficiency_reward_weight: 3.0
    healthy_reward: 2.0
    ctrl_cost_weight: 0.0

    use_friction_chg: false
    terminate_when_unhealthy: true
    unhealthy_max_steps: 30
    use_imu_window: false
    use_vels_window: false

sampling:
  num_envs: 8
  vec_env: subproc
  start_method: spawn

normalization:
  enabled: true
  clip_obs: 10.0
  epsilon: 1.0e-8

action_normalization:
  enabled: true

# Intentionally no resume section: initialize a new policy and optimizer.
algorithm:
  name: PPO
  policy: MlpPolicy
  device: auto
  kwargs:
    learning_rate: 0.0001
    gamma: 0.95
    n_steps: 512
    batch_size: 512
    n_epochs: 2
    target_kl: 0.04
  policy_kwargs:
    net_arch: [512, 512, 512, 512, 512]
    activation_fn: tanh

# 6,937 iterations * (512 steps * 8 environments) = 28,413,952.
training:
  total_timesteps: 28413952

evaluation:
  enabled: true
  eval_freq: 100000
  n_eval_episodes: 3
  deterministic: true

checkpointing:
  enabled: true
  save_freq: 250000

video:
  enabled: true
  start_iteration: 10
  record_every_iterations: 100
  video_length: 300
  deterministic: true
