schema_version: 2

# Stage 2: continue the v2 stability-first CCW policy.
#
# Basis (v2 Stage 1, run 20260905-195059): monotonic improvement to the end
# (eval -2,196 -> +28,063, ep_len 44 -> 1,542, best len 2,895) with target
# rate reached (aligned_yaw 0.507) and anchor held (0.123 m). No collapse —
# the stability-first objective fixed v1's runaway. Final approx_kl 1.9e-3
# (~1/20 of target_kl), clip 0.003 — trust region idle, so apply the standard
# lineage Stage 2 recipe: n_epochs 2 -> 3, lr/target_kl/gamma kept.
experiment:
  name: ppo_plane_rot_ccw_v2_continue_stage2
  seed: 42
  output_dir: runs/ppo_plane_rot_ccw_v2_continue_stage2

environment:
  id: horcrux_env/plane-rotation-v0
  kwargs:
    joy_input_random: false
    joy_input: [0.0, 0.0, 1.0]
    use_gait: true
    gait_params: [30, 30, 40, 40, 315]

    rotation_reward_weight: 45.0
    anchor_cost_weight: 50.0
    anchor_dead_zone: 0.05
    anchor_healthy_radius: 0.2
    rotation_target_rate: 0.5
    rotation_overspeed_tolerance: 0.15
    rotation_overspeed_weight: 45.0
    unhealthy_cost_weight: 1000.0
    anchor_cost_cap: 2.0
    trans_vel_cost_weight: 0.0
    efficiency_reward_weight: 3.0
    healthy_reward: 2.0
    ctrl_cost_weight: 0.0

    use_friction_chg: false
    terminate_when_unhealthy: true
    unhealthy_max_steps: 30
    use_imu_window: false
    use_vels_window: false

sampling:
  num_envs: 8
  vec_env: subproc
  start_method: spawn

normalization:
  enabled: true
  clip_obs: 10.0
  epsilon: 1.0e-8

action_normalization:
  enabled: true

resume:
  model_path: policies/rotation/ccw/01_ccw_v2_from_scratch/final_model.zip
  vecnormalize_path: policies/rotation/ccw/01_ccw_v2_from_scratch/vecnormalize.pkl

algorithm:
  name: PPO
  policy: MlpPolicy
  device: auto
  kwargs:
    learning_rate: 0.0001
    gamma: 0.99
    n_steps: 512
    batch_size: 512
    n_epochs: 3
    target_kl: 0.04
  policy_kwargs:
    net_arch: [512, 512, 512, 512, 512]
    activation_fn: tanh

# 6,937 iterations * (512 steps * 8 environments) = 28,413,952.
training:
  total_timesteps: 28413952

evaluation:
  enabled: true
  eval_freq: 100000
  n_eval_episodes: 3
  deterministic: true

checkpointing:
  enabled: true
  save_freq: 250000

video:
  enabled: true
  start_iteration: 10
  record_every_iterations: 100
  video_length: 300
  deterministic: true
