schema_version: 2

# Temporal-ratio study (d60l30): e_d2/e_l2 = 60/30, delta=210.
# 동일 비율 2.0의 저주파 변형 (개루프 dX +10.1, roll 19.3%)
# 10M-step same-budget diagnostic run (user hypothesis: dorsal temporal >
# lateral helps terrain traversal). Reward/PPO identical to forward Stage 1.
experiment:
  name: ppo_plane_tempstudy_d60l30
  seed: 42
  output_dir: runs/ppo_plane_tempstudy/d60l30

environment:
  id: horcrux_env/plane-v0
  kwargs:
    joy_input_random: false
    joy_input: [1.0, 0.0, 0.0]
    use_gait: true
    gait_params: [30, 30, 60, 30, 210]

    forward_reward_weight: 60.0
    efficiency_reward_weight: 3.0
    healthy_reward: 2.0
    rotation_norm_cost_weight: 10.0
    proj_dist_cost_weight: 0.0
    ctrl_cost_weight: 0.0

    use_friction_chg: false
    terminate_when_unhealthy: true
    unhealthy_max_steps: 30
    use_imu_window: false
    use_vels_window: false

sampling:
  num_envs: 8
  vec_env: subproc
  start_method: spawn

normalization:
  enabled: true
  clip_obs: 10.0
  epsilon: 1.0e-8

action_normalization:
  enabled: true

# Intentionally no resume section: initialize a new policy and optimizer.
algorithm:
  name: PPO
  policy: MlpPolicy
  device: auto
  kwargs:
    learning_rate: 0.0001
    gamma: 0.95
    n_steps: 512
    batch_size: 512
    n_epochs: 2
    target_kl: 0.04
  policy_kwargs:
    net_arch: [512, 512, 512, 512, 512]
    activation_fn: tanh

# 6,937 iterations * (512 steps * 8 environments) = 28,413,952.
training:
  total_timesteps: 10158080

evaluation:
  enabled: true
  eval_freq: 100000
  n_eval_episodes: 3
  deterministic: true

checkpointing:
  enabled: true
  save_freq: 2000000

video:
  enabled: true
  start_iteration: 10
  record_every_iterations: 400
  video_length: 300
  deterministic: true
