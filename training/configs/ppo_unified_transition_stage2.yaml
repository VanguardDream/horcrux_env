schema_version: 2

# Stage 2: gait 전환 학습 계속 (Stage 1 final 재개).
#
# 근거 (Stage 1 run 20260909-153324, 40.0M): 말기 approx_kl 0.0010 (target 0.04),
# clip_fraction 0.0015, EV 0.921 — 신뢰 영역이 거의 안 쓰이는 "KL 유휴" 상태이며
# 평가 리턴은 계속 상승 중(최고 22,624 @ 27.5M, 마지막 19,244). 방위/회전 계보에서
# 검증된 레시피대로 n_epochs 2 -> 3으로 갱신 강도를 올린다. lr 1e-4, target_kl 0.04,
# 환경·보상·전환 커리큘럼·네트워크는 Stage 1과 동일(frozen).
# 평가 에피소드 10 -> 20: 무작위 전환으로 평가 편차가 커(−1.9K~22.6K) best_model
# 선택이 요동친다 — 정책 학습과 무관한 평가 설정만 변경.
experiment:
  name: ppo_unified_transition_stage2
  seed: 43
  output_dir: runs/ppo_unified_transition_stage2

environment:
  id: horcrux_env/plane-unified-v0
  kwargs:
    # 방위 계보 공통 보상 계수 (frozen)
    forward_reward_weight: 60.0
    efficiency_reward_weight: 3.0
    healthy_reward: 2.0
    rotation_norm_cost_weight: 10.0
    proj_dist_cost_weight: 0.0
    ctrl_cost_weight: 0.0

    use_friction_chg: false
    terminate_when_unhealthy: true
    unhealthy_max_steps: 30
    use_imu_window: false
    use_vels_window: false

    # 회전 앵커: 종료 대신 근접 보상 (Stage 1과 동일)
    anchor_terminate: false
    anchor_proximity_reward_weight: 10.0
    anchor_proximity_radius: 0.2

    # 전환 커리큘럼 (Stage 1과 동일)
    switch_enabled: true
    switch_count_range: [1, 4]
    switch_min_dwell: 100
    switch_mode: align
    random_init_phase: true
    episode_horizon: 1000

sampling:
  num_envs: 8
  vec_env: subproc
  start_method: spawn

normalization:
  enabled: true
  clip_obs: 10.0
  epsilon: 1.0e-8

action_normalization:
  enabled: true

# Stage 1 final 재개 (2026-09-10 정책 폴더 정리 후 경로; 이동 전 runs/ppo_unified_transition_stage1/20260909-153324-…)
resume:
  model_path: policies/unified/01_transition_stage1/final_model.zip
  vecnormalize_path: policies/unified/01_transition_stage1/vecnormalize.pkl

algorithm:
  name: PPO
  policy: MlpPolicy
  device: auto
  kwargs:
    learning_rate: 0.0001
    gamma: 0.99
    n_steps: 512
    batch_size: 512
    n_epochs: 3
    target_kl: 0.04
  policy_kwargs:
    net_arch: [512, 512, 512, 512, 512]
    activation_fn: tanh

# 추가 40M (누적 80M)
training:
  total_timesteps: 40000000

evaluation:
  enabled: true
  eval_freq: 250000
  n_eval_episodes: 20
  deterministic: true

checkpointing:
  enabled: true
  save_freq: 500000

video:
  enabled: true
  start_iteration: 10
  record_every_iterations: 200
  video_length: 600
  deterministic: true
