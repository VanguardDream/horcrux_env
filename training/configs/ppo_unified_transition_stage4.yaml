schema_version: 2

# 통합(단일) 정책 전환 커리큘럼 — Stage 4 (2026-09-14, 사용자 부재 중 자율 캠페인).
#
# 근거: 경로 추종 재실험(v2, 시드 10 짝지음)에서 "합친 정책 + 새 시작 위상 규칙(lat)"이 여섯 조합 중 최선이었고,
# 규칙만 바꿔 얻은 이득이 sign 대비 평균 0.08 m였다. 통합 정책은 Stage 1~3을 sign 규칙(switch_mode align, 기본
# align_rule sign) + 무작위 초기 위상으로 학습했으므로, 배포 시 쓰는 lat 규칙과 학습 분포를 맞추는 것이 이 단계의
# 목적이다. 보상·종료·앵커 근접 보상·커리큘럼(1~4회 전환, dwell 100, horizon 1000)은 Stage 3과 동일(frozen).
# 바뀌는 것은 전환 시작 위상 규칙 하나(align_rule: lat)뿐이다. 옵티마이저는 Stage 3 값(lr 2e-4, ep 3, KL 0.04) 유지.
# 03_transition_stage3 final(대표)에서 재개. 판정은 (1) 고정 시드 40판 벤치마크(전환 실패·δ=203 도착 실패·완주율)와
# (2) 다양한 웨이포인트 경로 검증(시드 10 짝지음, lat 규칙, 새 커맨더 기본값)을 Stage 3 final과 비교해서 한다.
experiment:
  name: ppo_unified_transition_stage4
  seed: 45
  output_dir: runs/ppo_unified_transition_stage4

environment:
  id: horcrux_env/plane-unified-v0
  kwargs:
    forward_reward_weight: 60.0
    efficiency_reward_weight: 3.0
    healthy_reward: 2.0
    rotation_norm_cost_weight: 10.0
    proj_dist_cost_weight: 0.0
    ctrl_cost_weight: 0.0

    use_friction_chg: false
    terminate_when_unhealthy: true
    unhealthy_max_steps: 30
    use_imu_window: false
    use_vels_window: false

    anchor_terminate: false
    anchor_proximity_reward_weight: 10.0
    anchor_proximity_radius: 0.2

    switch_enabled: true
    switch_count_range: [1, 4]
    switch_min_dwell: 100
    switch_mode: align
    align_rule: lat            # Stage 4: 전환 시작 위상 규칙을 배포 규칙(가로 부호 우선)에 맞춤
    random_init_phase: true
    episode_horizon: 1000

sampling:
  num_envs: 8
  vec_env: subproc
  start_method: spawn

normalization:
  enabled: true
  clip_obs: 10.0
  epsilon: 1.0e-8

action_normalization:
  enabled: true

resume:
  model_path: policies/unified/03_transition_stage3/final_model.zip
  vecnormalize_path: policies/unified/03_transition_stage3/vecnormalize.pkl

algorithm:
  name: PPO
  policy: MlpPolicy
  device: auto
  kwargs:
    learning_rate: 0.0002
    gamma: 0.99
    n_steps: 512
    batch_size: 512
    n_epochs: 3
    target_kl: 0.04
  policy_kwargs:
    net_arch: [512, 512, 512, 512, 512]
    activation_fn: tanh

training:
  total_timesteps: 40000000

evaluation:
  enabled: true
  eval_freq: 250000
  n_eval_episodes: 20
  deterministic: true

checkpointing:
  enabled: true
  save_freq: 500000

video:
  enabled: true
  start_iteration: 10
  record_every_iterations: 200
  video_length: 600
  deterministic: true
